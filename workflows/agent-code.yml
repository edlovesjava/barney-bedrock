# Copy to <target repo>/.github/workflows/agent-code.yml
#
# Runs the barney coder when an issue is labelled `agent`.
# Repo settings needed:
#   variables: AWS_ROLE_ARN   (from infra/iam/github-oidc.yaml output)
#   secrets:   BARNEY_GITHUB_TOKEN  (fine-grained PAT: contents, issues, pull requests rw)
#   barney.toml at the repo root, with [runtime] image = ghcr.io/<owner>/barney-platformio:latest
name: agent-code
on:
  issues:
    types: [labeled]

permissions:
  id-token: write   # OIDC to AWS
  contents: read    # checkout; pushes use BARNEY_GITHUB_TOKEN so they trigger other workflows

concurrency:
  group: agent-code-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prep:
    if: github.event.label.name == 'agent'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.cfg.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          image=$(python3 -c 'import tomllib,sys; d=tomllib.load(open("barney.toml","rb")); print(d.get("runtime",{}).get("image","ghcr.io/edlovesjava/barney:latest"))')
          echo "image=$image" >> "$GITHUB_OUTPUT"

  code:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.prep.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: barney code
        env:
          BARNEY_GITHUB_TOKEN: ${{ secrets.BARNEY_GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$PWD"
          barney code --repo "${{ github.repository }}" --issue "${{ github.event.issue.number }}" \
                      --workdir . --record barney-run.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barney-run-issue-${{ github.event.issue.number }}
          path: barney-run.json

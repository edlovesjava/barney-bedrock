; Seed project used only at image build time so that platforms, toolchains,
; frameworks and the Unity test framework are already installed. Keep the
; envs here a superset of what target repos use.
[env:esp32s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1

[env:esp32]
platform = espressif32
framework = arduino
board = esp32dev

[env:native]
platform = native
test_framework = unity

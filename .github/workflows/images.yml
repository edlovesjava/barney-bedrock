name: images
on:
  push:
    branches: [main]
    paths: ["images/**", "barney/**", "pyproject.toml", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/barney:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/barney:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

  platformio:
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/platformio/Dockerfile
          build-args: BASE=${{ env.REGISTRY }}/${{ env.OWNER }}/barney:${{ needs.base.outputs.tag }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/barney-platformio:${{ needs.base.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/barney-platformio:latest
          cache-from: type=gha,scope=platformio
          cache-to: type=gha,scope=platformio,mode=max

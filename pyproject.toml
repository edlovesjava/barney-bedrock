[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barney"
version = "0.1.0"
description = "Autonomous coding agent on AWS Bedrock: GitHub issue to reviewed PR"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[project.scripts]
barney = "barney.cli:main"

[tool.setuptools.packages.find]
include = ["barney*"]

[tool.setuptools.package-data]
"barney.roles" = ["prompts/*.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
